name: Android CI

on:
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > androidApp/google-services.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Create local.properties for CI
        run: |
          cat <<EOF > local.properties
          CABINET_DOMAIN=dummy   
          YANDEX_CAPTCHA_SITE_KEY=dummy
          EOF

      # 1. Запуск Detekt
      - name: Run Detekt
        run: ./gradlew detekt

      # Сборка APK (необходима для загрузки)
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 3. Загрузка в Firebase App Distribution
      - name: Upload to Firebase App Distribution
        uses: w9jds/firebase-action@master
        with:
          args: appdistribution:distribute androidApp/build/outputs/apk/debug/androidApp-debug.apk --app ${{ secrets.FIREBASE_APP_ID }} --groups "qa-team"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}